name: asciiartor
version: 1.0.0
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-asciiartor: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.asciiartor # adjust accordingly to your app name

apps:
  asciiartor:
    command: asciiartor
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-asciiartor
parts:
  asciiartor:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
